<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طابور - دخول المنشآت</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- Main Container -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Business Login Card (default visible) -->
                <div class="card shadow mb-4" id="business-login-card">
                    <!-- Header -->
                    <div class="card-header-gradient text-center py-3 text-white"
                         style="background: linear-gradient(to right, #6a11cb, #2575fc); border-radius: .5rem .5rem 0 0;">
                        <h1 class="mb-0">طابور</h1>
                        <p class="mb-0">دخول المنشآت</p>
                    </div>

                    <!-- Form Body -->
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3>تسجيل دخول المنشأة</h3>
                            <p class="text-muted">سجّل دخولك للوصول إلى لوحة التحكم</p>
                        </div>

                        <form id="business-login-form">
                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">البريد الإلكتروني</label>
                                <input type="email" class="form-control" id="business-email-login" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label">كلمة المرور</label>
                                <input type="password" class="form-control" id="business-pass-login" required>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-gradient">تسجيل الدخول</button>
                            </div>
                        </form>

                        <!-- Switch to Register -->
                        <div class="text-center">
                            <p>لا تمتلك حساب منشأة؟ <a href="#" id="show-register">إنشاء حساب جديد</a></p>
                        </div>
                    </div>
                </div>

                <!-- Business Register Form (hidden initially) -->
                <div class="card shadow d-none" id="business-register-card">
                    <!-- Header -->
                    <div class="card-header-gradient text-center py-3 text-white"
                         style="background: linear-gradient(to right, #6a11cb, #2575fc); border-radius: .5rem .5rem 0 0;">
                        <h1 class="mb-0">طابور</h1>
                        <p class="mb-0">إدارة الطوابير الذكية</p>
                    </div>
                    
                    <!-- Form Body -->
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3>إنشاء حساب منشأة جديد</h3>
                            <p class="text-muted">انضم إلى طابور اليوم</p>
                        </div>
                        
                        <form id="businesses-register-form">
                            <!-- Name -->
                            <div class="mb-3">
                                <label class="form-label">اسم المنشأة</label>
                                <input type="text" class="form-control" id="business-name" required>
                            </div>
                            
                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">البريد الإلكتروني الخاص بالمنشأة</label>
                                <input type="email" class="form-control" id="business-email-reg" required>
                            </div>
                            
                            <!-- Phone -->
                            <div class="mb-3">
                                <label class="form-label">رقم الهاتف الخاص بالمنشأة</label>
                                <input type="tel" class="form-control" id="business-phone" placeholder="+966 5X XXX XXXX" required>
                            </div>
                            
                            <!-- Service Type -->
                            <div class="mb-3">
                                <label class="form-label">نوع الخدمة</label>
                                <input type="text" class="form-control" id="service-type" required>
                            </div>

                            <!-- Address -->
                            <div class="mb-3">
                                <label class="form-label">عنوان المنشأة</label>
                                <input type="text" class="form-control" id="business-address"
                                       placeholder="الرياض، شارع العليا ..." required>
                            </div>
                            
                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label">كلمة المرور</label>
                                <input type="password" class="form-control" id="pass-reg" required>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-gradient">إنشاء الحساب</button>
                            </div>
                        </form>
                        
                        <!-- Switch to Login -->
                        <div class="text-center">
                            <p>لديك حساب بالفعل؟ <a href="#" id="show-login">سجّل دخولك</a></p>
                        </div>
                    </div>
                </div>
                <!-- /Business Register Card -->

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="business_index.js"></script>
</body>
</html>
